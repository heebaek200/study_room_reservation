<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>스터디룸 상세 | 스터디룸 예약 관리</title>

    <link
            rel="stylesheet"
            href="/css/common.css"
    >
</head>

<body class="app-body">

{{header}}

{{navigation}}

<main class="app-main">
    <section class="page-heading">
        <p class="eyebrow">
            RESERVATION
        </p>

        <h1>스터디룸 예약 신청</h1>

        <p>
            이용할 스터디룸과 시간을 확인한 뒤
            예약을 신청해 주세요.
        </p>
    </section>

    <!-- 스터디룸 정보 -->
    <article aria-labelledby="room-heading">
        <header>
            <p>선택한 스터디룸</p>

            <h2 id="room-heading">
                {{roomName}}
            </h2>

            <small>
                스터디룸 번호: {{roomId}}
            </small>
        </header>

        <dl>
            <div>
                <dt>수용 인원</dt>
                <dd>{{capacity}}명</dd>
            </div>

            <div>
                <dt>시간당 이용료</dt>
                <dd>{{hourlyRate}}원</dd>
            </div>
        </dl>

        <menu>
            <li>
                <a href="/rooms">
                    목록으로
                </a>
            </li>
        </menu>
    </article>

    <!-- 💡 1. 여기에 div 태그를 추가하여 예약 폼을 감싸줍니다. -->
    <div style="display: {{reservationSectionDisplay}};">

    <!-- 예약 신청 -->
    <article aria-labelledby="reservation-heading">
        <header>
            <h2 id="reservation-heading">
                예약 시간 입력
            </h2>

            <p>
                종료 일시는 시작 일시보다 늦어야 합니다.
            </p>
        </header>

        <form
                action="/reservations/create"
                method="post"
        >
            <input
                    type="hidden"
                    name="roomId"
                    value="{{roomId}}"
            >

            <div>
                <label for="startTime">
                    시작 일시
                </label>

                <input
                        id="startTime"
                        name="startTime"
                        type="datetime-local"
                        value="{{startTime}}"
                        step="60"
                        required
                >
            </div>

            <div>
                <label for="endTime">
                    종료 일시
                </label>

                <input
                        id="endTime"
                        name="endTime"
                        type="datetime-local"
                        value="{{endTime}}"
                        step="60"
                        required
                >
            </div>

            <output
                    role="status"
                    aria-live="polite"
            >{{resultMessage}}
            </output>

            <menu>
                <li>
                    <a href="/rooms">
                        목록으로
                    </a>
                </li>

                <li>
                    <a href="/home">
                        홈으로
                    </a>
                </li>

                <li>
                    <button type="submit">
                        예약 신청
                    </button>
                </li>
            </menu>
        </form>
    </article>

    </div> <!-- 💡 2. 폼이 끝나는 곳에서 div 태그를 닫아줍니다. -->
</main>

{{footer}}

</body>
</html>
