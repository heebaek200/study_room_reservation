<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >
    <title>스터디룸 예약 관리</title>
    <link rel="stylesheet" href="/css/common.css">
</head>
<body class="app-body">

{{header}}

{{navigation}}

<main class="app-main">
    <section class="page-heading">
        <p class="eyebrow">USER HOME</p>
        <h1>{{userName}}님, 안녕하세요.</h1>
        <p>
            스터디룸을 확인하거나 예약 및 회원 정보를
            관리할 수 있습니다.
        </p>
    </section>

    <section
            class="menu-grid"
            aria-label="사용 가능한 기능"
    >
        <a class="menu-card" href="/rooms">
            <strong>스터디룸 조회</strong>
            <span>
                이용 가능한 스터디룸과 상세 정보를 확인합니다.
            </span>
        </a>

        <a class="menu-card" href="/my-reservations">
            <strong>내 예약</strong>
            <span>
                예약 시간과 현재 예약 상태를 확인합니다.
            </span>
        </a>

        <a class="menu-card" href="/my-refunds">
            <strong>내 환불</strong>
            <span>
                예약 취소 후 생성된 환불 요청을 확인합니다.
            </span>
        </a>

        <a class="menu-card" href="/my-info">
            <strong>내 정보</strong>
            <span>
                회원 정보를 확인하거나 이름을 변경합니다.
            </span>
        </a>
    </section>
</main>

{{footer}}

</body>
</html>
