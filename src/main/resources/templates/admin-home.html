<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >
    <title>관리자 홈 | 스터디룸 예약 관리</title>
    <link rel="stylesheet" href="/css/common.css">
</head>
<body class="app-body">

{{header}}

{{navigation}}

<main class="app-main">
    <section class="page-heading">
        <p class="eyebrow">ADMIN HOME</p>
        <h1>{{userName}} 관리자님, 안녕하세요.</h1>
        <p>
            스터디룸과 회원 정보를 확인하고 예약 및 환불
            현황을 관리할 수 있습니다.
        </p>
    </section>

    <section
            class="menu-grid"
            aria-label="관리자 기능"
    >
        <a class="menu-card" href="/rooms">
            <strong>스터디룸 조회</strong>
            <span>
                등록된 스터디룸의 목록과 상세 정보를 확인합니다.
            </span>
        </a>

        <a class="menu-card" href="/admin/rooms">
            <strong>스터디룸 관리</strong>
            <span>
                스터디룸을 등록하고 기본 정보를 수정합니다.
            </span>
        </a>

        <a class="menu-card" href="/admin/users">
            <strong>회원 관리</strong>
            <span>
                가입된 전체 회원의 정보와 상태를 확인합니다.
            </span>
        </a>

        <a class="menu-card" href="/admin/reservations">
            <strong>전체 예약</strong>
            <span>
                회원들이 생성한 전체 예약을 확인합니다.
            </span>
        </a>

        <a class="menu-card" href="/admin/refunds">
            <strong>환불 관리</strong>
            <span>
                환불 요청을 확인하고 승인 또는 거절합니다.
            </span>
        </a>
    </section>
</main>

{{footer}}

</body>
</html>
