<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >
    <title>전체 예약 | 스터디룸 예약 관리</title>
    <link rel="stylesheet" href="/css/common.css">
</head>
<body class="app-body">

{{header}}

{{navigation}}

<main class="app-main">
    <section class="page-heading">
        <p class="eyebrow">ADMIN RESERVATIONS</p>
        <h1>전체 예약</h1>
        <p>
            회원들의 예약 내역과 현재 예약 상태를 확인할 수 있습니다.
        </p>
    </section>

    <article>
        <header>
            <h2>예약 내역</h2>
            <p>
                전체 예약을 확인하거나 예약 번호로 특정 예약을 조회합니다.
            </p>
        </header>

        <form action="/admin/reservations" method="get">
            <div>
                <label for="reservationId">예약 번호</label>
                <input
                        id="reservationId"
                        name="reservationId"
                        type="number"
                        min="1"
                        step="1"
                        placeholder="조회할 예약 번호"
                        required
                >
            </div>

            <menu>
                <li>
                    <a href="/admin/reservations">전체 보기</a>
                </li>
                <li>
                    <button type="submit">예약 조회</button>
                </li>
            </menu>
        </form>

        <table>
            <thead>
            <tr>
                <th scope="col">예약 번호</th>
                <th scope="col">회원 번호</th>
                <th scope="col">스터디룸 번호</th>
                <th scope="col">시작 일시</th>
                <th scope="col">종료 일시</th>
                <th scope="col">이용 금액</th>
                <th scope="col">예약 상태</th>
            </tr>
            </thead>
            <tbody>
            {{reservationRows}}
            </tbody>
        </table>

        <menu>
            <li>
                <a href="/home">홈으로</a>
            </li>
        </menu>
    </article>
</main>

{{footer}}

</body>
</html>
