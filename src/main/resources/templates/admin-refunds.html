<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >
    <title>환불 관리 | 스터디룸 예약 관리</title>
    <link rel="stylesheet" href="/css/common.css">
</head>
<body class="app-body">

{{header}}

{{navigation}}

<main class="app-main">
    <section class="page-heading">
        <p class="eyebrow">ADMIN REFUNDS</p>
        <h1>환불 관리</h1>
        <p>
            환불 요청을 조회하고 처리 대기 중인 요청을
            승인하거나 거절할 수 있습니다.
        </p>
    </section>

    <article>
        <header>
            <h2>환불 내역</h2>
            <p>
                처리 완료된 환불은 다시 승인하거나 거절할 수 없습니다.
            </p>
        </header>

        <!-- 상태 필터: 버튼을 누르면 해당 상태의 목록으로 이동합니다. -->
        <form action="/admin/refunds" method="get">
            <menu>
                <li>
                    <button type="submit" name="status" value="ALL">
                        전체
                    </button>
                </li>
                <li>
                    <button
                            type="submit"
                            name="status"
                            value="REQUESTED"
                    >
                        처리 대기
                    </button>
                </li>
                <li>
                    <button
                            type="submit"
                            name="status"
                            value="APPROVED"
                    >
                        승인
                    </button>
                </li>
                <li>
                    <button
                            type="submit"
                            name="status"
                            value="REJECTED"
                    >
                        거절
                    </button>
                </li>
            </menu>
        </form>

        <!-- 번호 조회는 상태 필터와 별도의 Form으로 처리합니다. -->
        <form action="/admin/refunds" method="get">
            <div>
                <label for="refundId">환불 번호</label>
                <input
                        id="refundId"
                        name="refundId"
                        type="number"
                        min="1"
                        step="1"
                        placeholder="조회할 환불 번호"
                        required
                >
            </div>

            <menu>
                <li>
                    <a href="/admin/refunds">전체 보기</a>
                </li>
                <li>
                    <button type="submit">환불 조회</button>
                </li>
            </menu>
        </form>

        <p>{{resultMessage}}</p>

        <table>
            <thead>
            <tr>
                <th scope="col">환불 번호</th>
                <th scope="col">예약 번호</th>
                <th scope="col">환불 상태</th>
                <th scope="col">처리</th>
            </tr>
            </thead>
            <tbody>
            {{refundRows}}
            </tbody>
        </table>

        <menu>
            <li>
                <a href="/home">홈으로</a>
            </li>
        </menu>
    </article>
</main>

{{footer}}

</body>
</html>
