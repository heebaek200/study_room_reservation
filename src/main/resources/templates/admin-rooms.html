<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>스터디룸 관리</title>
    <link rel="stylesheet" href="/css/common.css">

    <style>
        .app-main article {
            background-color: #ffffff;
            border: 1px solid #e1e4e8;
            padding: 24px;
            margin-bottom: 24px;
        }
        .app-main article h2 {
            font-size: 1.25rem;
            margin-top: 0;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #eee;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        .data-table th {
            background-color: #f4f6f8;
            padding: 14px 16px;
            font-weight: bold;
            color: #495057;
            border-top: 1px solid #dee2e6;
            border-bottom: 1px solid #dee2e6;
        }
        .data-table td {
            padding: 14px 16px;
            border-bottom: 1px solid #f1f3f5;
            vertical-align: middle;
        }
        .data-table td button {
            background-color: #ffffff;
            color: #333333;
            border: 1px solid #ced4da;
            padding: 6px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .data-table td button:hover {
            background-color: #f8f9fa;
        }
        #room-form div {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }
        #room-form label {
            width: 140px;
            font-weight: bold;
            color: #343a40;
        }
        #room-form input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 1rem;
        }
        #room-form menu {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 32px;
            padding: 0;
            list-style: none;
        }
        #room-form menu button {
            background-color: #2c5282;
            color: white;
            border: none;
            padding: 10px 32px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        #room-form menu a, #cancel-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #ced4da;
            padding: 10px 32px;
            border-radius: 4px;
            color: #333;
            text-decoration: none;
            background-color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>

<!-- 상단 헤더 -->
<header class="app-header">
    <div class="header-inner">
        <a class="app-title" href="/home">스터디룸 예약 관리</a>
        <div class="login-info">
            <span class="role-badge">{{roleName}}</span>
            <form class="logout-form" action="/logout" method="post">
                <button class="logout-button" type="submit">로그아웃</button>
            </form>
        </div>
    </div>
</header>

<!-- 관리자 전용 메뉴 -->
<nav class="app-nav" aria-label="주요 메뉴">
    <ul class="nav-list">
        <li><a class="nav-link" href="/home">홈</a></li>
        <li><a class="nav-link" href="/rooms">스터디룸</a></li>
        <li><a class="nav-link" href="/admin/users">회원 관리</a></li>
        <li><a class="nav-link current" href="/admin/rooms">스터디룸 관리</a></li>
        <li><a class="nav-link" href="/admin/reservations">예약 관리</a></li>
        <li><a class="nav-link" href="/admin/refunds">환불 관리</a></li>
    </ul>
</nav>

<!-- 메인 컨텐츠 영역 -->
<main class="app-main">
    <section class="page-heading">
        <p class="eyebrow">ROOM MANAGEMENT</p>
        <h1>스터디룸 관리</h1>
        <p>스터디룸을 등록하거나 기존 정보를 수정할 수 있습니다.</p>
    </section>

    <!-- 💡 규칙 3: 잘못된 입력값이나 중복 이름은 입력 영역 근처에 표시 -->
    <div style="color: #d93025; font-weight: bold; margin-bottom: 1rem;">
        {{errorMessage}}
    </div>

    <!-- 1. 등록된 스터디룸 목록 -->
    <article aria-labelledby="room-list-heading">
        <h2 id="room-list-heading" class="visually-hidden">등록된 스터디룸</h2>

        <table class="data-table">
            <thead>
            <tr>
                <th>번호</th>
                <th>이름</th>
                <th>수용 인원</th>
                <th>시간당 이용료</th>
                <th>관리</th>
            </tr>
            </thead>
            <tbody id="room-list-tbody">
            <!-- 데이터 렌더링 영역 -->
            </tbody>
        </table>
    </article>

    <!-- 2. 스터디룸 등록/수정 입력 영역 (동일 영역 공유) -->
    <article aria-labelledby="form-heading" style="margin-top: 2rem; border-top: 1px solid #ddd; padding-top: 1.5rem;">
        <!-- 동적으로 변경될 제목 -->
        <h2 id="form-heading">스터디룸 등록</h2>

        <form id="room-form" action="/admin/rooms/save" method="post">
            <!-- 수정 시 대상 roomId를 담을 숨김 필드 -->
            <input type="hidden" id="roomId" name="roomId" value="">

            <div>
                <label for="name">스터디룸 이름</label>
                <input type="text" id="name" name="name" placeholder="이름을 입력하세요" required>
            </div>

            <div>
                <label for="capacity">수용 인원</label>
                <input type="number" id="capacity" name="capacity" placeholder="명" min="1" required>
            </div>

            <div>
                <label for="hourlyRate">시간당 이용료</label>
                <input type="number" id="hourlyRate" name="hourlyRate" placeholder="금액" min="0" required>
            </div>

            <menu>
                <!-- 수정 모드일 때만 나타나는 취소(등록 모드로 복귀) 버튼 -->
                <button type="button" id="cancel-btn" style="display: none;" onclick="resetToRegisterMode()">취소</button>
                <a href="/home">홈으로</a>
                <!-- 규칙 1: 등록 모드에서는 '등록' 버튼, 수정 시 '수정' 버튼으로 전환 -->
                <button type="submit" id="submit-btn">등록</button>
            </menu>
        </form>
    </article>
</main>

<!-- JSON 안전 파싱을 위한 숨김 데이터 영역 -->
<textarea id="rooms-json-data" style="display: none;">{{roomsData}}</textarea>

<script>
    const rawJsonText = document.getElementById('rooms-json-data').value;
    let roomsData = [];
    if (rawJsonText) {
        roomsData = JSON.parse(rawJsonText);
    }

    const tbody = document.getElementById('room-list-tbody');

    roomsData.forEach(room => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
                <td>${room.roomId}</td>
                <td>${room.name}</td>
                <td>${room.capacity}명</td>
                <td>${room.hourlyRate}원</td>
                <td>
                    <button type="button" onclick="setEditMode(${room.roomId})">수정</button>
                </td>
            `;
        tbody.appendChild(tr);
    });

    // 💡 규칙 2: 수정 대상 선택 시 같은 입력 영역을 '수정 모드'로 전환
    function setEditMode(roomId) {
        const room = roomsData.find(r => r.roomId === roomId);
        if (!room) return;

        // 입력 폼에 기존 데이터 채우기
        document.getElementById('roomId').value = room.roomId;
        document.getElementById('name').value = room.name;
        document.getElementById('capacity').value = room.capacity;
        document.getElementById('hourlyRate').value = room.hourlyRate;

        // UI 및 전송 경로 변경 (규칙 1 반영)
        document.getElementById('form-heading').innerText = '스터디룸 수정';
        document.getElementById('submit-btn').innerText = '수정';
        document.getElementById('room-form').action = '/admin/rooms/update';
        document.getElementById('cancel-btn').style.display = 'block'; // 취소 버튼 노출

        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    // 💡 다시 '등록 모드'로 원복시키는 함수
    function resetToRegisterMode() {
        document.getElementById('roomId').value = '';
        document.getElementById('name').value = '';
        document.getElementById('capacity').value = '';
        document.getElementById('hourlyRate').value = '';

        document.getElementById('form-heading').innerText = '스터디룸 등록';
        document.getElementById('submit-btn').innerText = '등록';
        document.getElementById('room-form').action = '/admin/rooms/save';
        document.getElementById('cancel-btn').style.display = 'none';
    }
</script>
</body>
</html>
