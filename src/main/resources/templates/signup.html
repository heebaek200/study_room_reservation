<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <link rel="stylesheet" href="/css/common.css">
</head>
<body>
<main>
    <h1>회원가입</h1>

    <form action="/signup" method="post">
        <div>
            <label for="email">이메일</label>
            <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="email"
                    required
            >
        </div>

        <div>
            <label for="name">이름</label>
            <input
                    id="name"
                    name="name"
                    type="text"
                    autocomplete="name"
                    required
            >
        </div>

        <div>
            <label for="password">비밀번호</label>
            <input
                    id="password"
                    name="password"
                    type="password"
                    minlength="6"
                    autocomplete="new-password"
                    required
            >
        </div>

        <div>
            <label for="password-confirm">비밀번호 확인</label>
            <input
                    id="password-confirm"
                    name="passwordConfirm"
                    type="password"
                    minlength="6"
                    autocomplete="new-password"
                    required
            >
        </div>

        <button type="submit">회원가입</button>
    </form>

    <p>
        이미 가입하셨다면 <a href="/login">로그인</a>
    </p>
</main>
</body>
</html>
