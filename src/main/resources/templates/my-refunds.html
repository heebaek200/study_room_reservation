<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >
    <title>내 환불 | 스터디룸 예약 관리</title>
    <link rel="stylesheet" href="/css/common.css">
</head>
<body class="app-body">

{{header}}

{{navigation}}

<main class="app-main">
    <section class="page-heading">
        <p class="eyebrow">MY REFUNDS</p>
        <h1>내 환불 내역</h1>
        <p>
            예약 취소 후 생성된 환불 요청 내역을 확인할 수 있습니다.
        </p>
    </section>

    <article>
        <header>
            <h2>환불 내역</h2>
            <p>
                환불 상태는 처리 대기, 승인, 거절로 표시됩니다.
            </p>
        </header>

        <p class="empty-message">
            {{emptyMessage}}
        </p>

        <table>
            <thead>
            <tr>
                <th>환불 번호</th>
                <th>예약 번호</th>
                <th>스터디룸 이름</th>
                <th>환불 금액</th>
                <th>상태 배지</th>
            </tr>
            </thead>

            <tbody>
            {{refundRows}}
            </tbody>
        </table>

        <menu>
            <li>
                <a href="/home">홈으로</a>
            </li>
        </menu>
    </article>
</main>

{{footer}}

</body>
</html>
